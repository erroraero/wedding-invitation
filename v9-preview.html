<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anjana & Rinu — Wedding Invitation</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

<link rel="preload" as="image" href="https://cdn.nxtdev.xyz/files/image/Picsart_26-05-14_00-14-09-106.png">

<style>
:root {
  --bg:         #0e0703;
  --brown:      #382208;
  --brown-dark: #261605;
  --brown-deep: #1a0e03;
  --gold:       #D4AF37;
  --gold-lt:    #F2D675;
  --gold-br:    #FFE066;
  --gold-dim:   #A87C20;
  --gold-pale:  #c49020;

  --page-w:     min(44vw, 420px);
  --page-h:     min(70vh, 580px);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
  background: radial-gradient(circle at top, #1a1008 0%, var(--bg) 60%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'EB Garamond', serif;
  overflow:hidden;
  position:relative;
  touch-action:manipulation;
  opacity:0;
  transition:opacity .8s ease;
}

body.ready {
  opacity:1;
}

#particles {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.book-title {
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(9px, 2vw, 11px);
  letter-spacing:4px;
  color:var(--gold-dim);
  text-transform:uppercase;
  margin-bottom:20px;
  z-index:10;
  text-align:center;
  animation:fadeDown 1s ease-out both;
}

@keyframes fadeDown {
  from {
    opacity:0;
    transform:translateY(-12px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.book-scene {
  perspective:2500px;
  width:calc(var(--page-w) * 2 + 4px);
  height:var(--page-h);
  position:relative;
  z-index:10;
  animation:bookReveal 1.4s cubic-bezier(.22,.61,.36,1) both;
  margin:0 auto;
}

.book-scene::before {
  box-shadow:
    0 0 80px rgba(212,175,55,.06),
    0 0 140px rgba(212,175,55,.04);
  content:'';
  position:absolute;
  top:8px;
  left:-8px;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.25);
  filter:blur(18px);
  z-index:-1;
  border-radius:6px;
}

.book-scene::after {
  content:'';
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:6px;
  height:100%;
  background:linear-gradient(to right,
    rgba(0,0,0,0.6) 0%,
    rgba(212,175,55,0.15) 35%,
    rgba(212,175,55,0.15) 65%,
    rgba(0,0,0,0.6) 100%);
  z-index:25;
  pointer-events:none;
}

@keyframes bookReveal {
  from {
    opacity:0;
    transform:translateY(30px) rotateX(5deg) scale(.96);
  }
  to {
    opacity:1;
    transform:translateY(0) rotateX(0) scale(1);
  }
}

.page {
  will-change: transform;
  transform-style: preserve-3d;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.25));
  transition:
    transform 1.1s cubic-bezier(.22,.61,.36,1),
    filter .8s ease,
    box-shadow .8s ease;
  backface-visibility:hidden;
  -webkit-font-smoothing:antialiased;


  position:absolute;
  width:var(--page-w);
  height:var(--page-h);
  top:0;
  left:50%;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.645,.045,.355,1.000), box-shadow .9s ease;
  cursor:pointer;
}

.page.flipped {
  transform:rotateY(-180deg);
  filter:drop-shadow(-18px 10px 25px rgba(0,0,0,.38));
  transform:rotateY(-180deg) rotateX(2deg);
  box-shadow:-25px 0 40px rgba(0,0,0,0.45);
}

.page::before {
  content:'';
  position:absolute;
  right:-3px;
  top:0;
  width:4px;
  height:100%;
  background:linear-gradient(to right, rgba(255,255,255,.05), rgba(0,0,0,.25));
  z-index:30;
}

.page-front,
.page-back {
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.02), transparent 30%),
    var(--brown);
  overflow:hidden;
  border:1px solid rgba(212,175,55,0.2);
}

.page-front::after,
.page-back::after,
.left-page::after {
  content:'';
  position:absolute;
  inset:0;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.03"/></svg>');
  pointer-events:none;
  opacity:.4;
}

.page-back {
  transform:rotateY(180deg);
}

.page-front::before,
.page-back::before,
.left-page::before {
  content:'';
  position:absolute;
  inset:6px;
  border:1px solid rgba(212,175,55,0.15);
  pointer-events:none;
  z-index:1;
}

.left-page {
  position:absolute;
  left:0;
  top:0;
  width:var(--page-w);
  height:var(--page-h);
  background:var(--brown);
  border:1px solid rgba(212,175,55,0.2);
  overflow:hidden;
  z-index:1;
  box-shadow:-10px 0 30px rgba(0,0,0,0.5);
}

.page-content {
  position:relative;
  width:100%;
  height:100%;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(15px, 3vw, 25px);
  text-align:center;
}

.nav-bar {
  display:flex;
  align-items:center;
  gap:clamp(15px, 5vw, 30px);
  margin-top:25px;
  z-index:10;
}

.nav-btn {
  width:44px;
  height:44px;
  border:1px solid var(--gold-dim);
  background:rgba(56,34,8,0.9);
  color:var(--gold);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  transition:.3s;
  backdrop-filter:blur(4px);
}

.nav-btn:hover:not(:disabled) {
  border-color:var(--gold);
  background:var(--brown-dark);
  transform:translateY(-2px);
}

.nav-btn:active {
  transform:scale(.92);
}

.nav-btn:disabled {
  opacity:.15;
  cursor:default;
}

.page-indicator {
  font-family:'Cinzel', serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--gold-dim);
}

.cal-btn,
.send-btn,
.locate-btn,
.music-btn {
  margin-top:15px;
  padding:9px 16px;
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  font-family:'Cinzel', serif;
  font-size:10px;
  letter-spacing:1px;
  cursor:pointer;
  text-decoration:none;
  transition:.3s;
  position:relative;
  overflow:hidden;
}

.cal-btn::before,
.send-btn::before,
.locate-btn::before,
.music-btn::before {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent);
  transform:translateX(-120%);
  transition:transform .7s ease;
}

.cal-btn:hover::before,
.send-btn:hover::before,
.locate-btn:hover::before,
.music-btn:hover::before {
  transform:translateX(120%);
}

.cal-btn:hover,
.send-btn:hover,
.locate-btn:hover,
.music-btn:hover {
  background:var(--gold);
  color:var(--brown-deep);
}

.input-field {
  background:rgba(255,255,255,0.05);
  border:1px solid var(--gold-dim);
  color:var(--gold-lt);
  padding:12px;
  width:80%;
  margin:5px 0;
  font-family:'EB Garamond', serif;
  outline:none;
  font-size:16px;
  transition:.3s;
}

.input-field:focus {
  border-color:var(--gold);
  box-shadow:0 0 12px rgba(212,175,55,0.12);
}

.input-field::placeholder {
  color:rgba(212,175,55,0.4);
}

.pg-name-lg {
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(18px, 4.5vw, 26px);
  color:var(--gold);
  text-shadow:
    0 2px 10px rgba(0,0,0,0.5),
    0 0 8px rgba(212,175,55,0.15);
  margin:5px 0;
}

.pg-name-md {
  font-family:'Cinzel Decorative', serif;
  font-size:clamp(14px, 3.5vw, 18px);
  color:var(--gold);
}

.pg-label {
  font-family:'Cinzel', serif;
  font-size:clamp(7px, 2vw, 9px);
  letter-spacing:3px;
  color:var(--gold-dim);
}

.pg-body {
  font-size:clamp(10px, 2.8vw, 12.5px);
  color:var(--gold-lt);
  line-height:1.6;
}

.pg-date-num {
  font-family:'Cinzel', serif;
  font-size:clamp(32px, 10vw, 52px);
  color:var(--gold);
}

.music-toggle {
  position:fixed;
  top:18px;
  right:18px;
  z-index:100;
}

.countdown {
  margin-top:14px;
  font-size:11px;
  color:var(--gold-dim);
  letter-spacing:2px;
}

.tap-hint {
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  font-family:'Cinzel', serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--gold-dim);
  z-index:50;
  opacity:.8;
  animation:fadeHint 2s ease-in-out infinite;
}

@keyframes fadeHint {
  0%,100% { opacity:.35; }
  50% { opacity:.9; }
}

@media (max-width:600px) {
  .book-scene {
    transform:scale(1.05);
  }
}

@media (prefers-reduced-motion:reduce) {
  * {
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
}
</style>

</head>
<body>

<canvas id="particles"></canvas>

<div class="tap-hint" id="tapHint">Tap Right Side →</div>

<button class="music-btn music-toggle" id="musicBtn">♫ MUSIC</button>

<div class="book-title">✦ &nbsp; Wedding Invitation &nbsp; ✦</div>

<div class="book-scene" id="bookScene">
  <div class="left-page" id="leftPage"></div>

  <div class="page" id="page1" style="z-index:15;"><div class="page-front" id="p1front"></div><div class="page-back" id="p1back"></div></div>
  <div class="page" id="page2" style="z-index:14;"><div class="page-front" id="p2front"></div><div class="page-back" id="p2back"></div></div>
  <div class="page" id="page3" style="z-index:13;"><div class="page-front" id="p3front"></div><div class="page-back" id="p3back"></div></div>
  <div class="page" id="page4" style="z-index:12;"><div class="page-front" id="p4front"></div><div class="page-back" id="p4back"></div></div>
  <div class="page" id="page5" style="z-index:11;"><div class="page-front" id="p5front"></div><div class="page-back" id="p5back"></div></div>
  <div class="page" id="page6" style="z-index:10;"><div class="page-front" id="p6front"></div><div class="page-back" id="p6back"></div></div>
</div>

<div class="nav-bar">
  <button class="nav-btn" id="prevBtn" disabled aria-label="Previous Page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M15 18L9 12L15 6" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="page-indicator" id="pageIndicator">Cover</div>

  <button class="nav-btn" id="nextBtn" aria-label="Next Page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M9 18L15 12L9 6" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.nxtdev.xyz/Sita%20Kalyana%20Vaibhogame%20%20%20KS%20Harisankar%20%20%20Kurinji.mp3" type="audio/mpeg">
</audio>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

window.addEventListener('load', () => {
  document.body.classList.add('ready');

  setTimeout(() => {
    pages[0].style.transform = 'rotateY(-12deg)';

    setTimeout(() => {
      pages[0].style.transform = '';
    }, 900);
  }, 600);
});

const guestName = new URLSearchParams(window.location.search).get('guest');

const weddingDate = new Date('2026-06-24T16:00:00');

const SVG_OM = `
<svg width="50" height="50" viewBox="0 0 58 58" style="margin-bottom:10px;">
  <text x="29" y="38" text-anchor="middle" font-size="28" fill="#D4AF37" font-family="serif">ॐ</text>
  <circle cx="29" cy="29" r="26" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
</svg>`;

function getCountdownText() {
  const now = new Date();
  const diff = weddingDate - now;
  const days = Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
  return `${days} DAYS REMAINING`;
}

function buildCover(el) {
  el.innerHTML = `
  <div class="page-content" style="justify-content:flex-start; padding-top:40px;">
    ${SVG_OM}

    <div class="pg-label" style="letter-spacing:2px; margin-top:50px;">
      WEDDING RECEPTION INVITATION
    </div>

    <div style="width:60%; height:1px; background:linear-gradient(to right, transparent, var(--gold), transparent); margin:20px 0 30px 0; opacity:.6;"></div>

    <div class="pg-name-lg">Anjana</div>
    <div class="pg-label">&amp;</div>
    <div class="pg-name-lg">Rinu</div>

    <div style="margin-top:15px;" class="pg-label">24 · JUNE · 2026</div>

    <div class="countdown">${getCountdownText()}</div>
  </div>`;
}

function buildInside(el) {
  el.innerHTML = `
  <div class="page-content">
    <img src="https://cdn.nxtdev.xyz/file_000000008eec71faa47f73b6db7500fe.png"
         alt="Wedding design"
         style="max-width:80%; height:auto; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.25);">
  </div>`;
}

function buildHosts(el) {
  el.innerHTML = `
  <div class="page-content">
    <div class="pg-label">With Joy</div>

    <div class="pg-name-md" style="margin:10px 0;">
      Mr. P. Mohanan &<br>Mrs. Dhanya Mohan
    </div>

    <div class="pg-body">
      invite you to the wedding reception of our daughter
    </div>
  </div>`;
}

function buildBride(el) {
  el.innerHTML = `
  <div class="page-content">
    <div class="pg-label">The Bride</div>

    <div class="pg-name-lg">Anjana Mohan</div>

    <div class="pg-body" style="font-size:clamp(9px,2.2vw,10.5px); line-height:1.4; opacity:.9; margin-bottom:12px; margin-top:10px;">
      Grand D/o. Late Appu Pulparambil & Late Lakshmi <br>
      and Late Damodharan Purathekattuparambil & Mrs. Shobana
    </div>

    <div class="pg-body" style="border-top:1px solid rgba(212,175,55,0.2); padding-top:8px; font-style:italic;">
      Pulparambil, Karanthur, Kunnamangalam
    </div>
  </div>`;
}

function buildGroom(el) {
  el.innerHTML = `
  <div class="page-content">
    <div class="pg-label">The Groom</div>

    <div class="pg-name-lg">Rinu K</div>

    <div class="pg-body" style="margin-bottom:12px;">
      S/o Mr. Unni K & Mrs. Reeja Unni
    </div>

    <div class="pg-body" style="border-top:1px solid rgba(212,175,55,0.2); padding-top:8px; font-style:italic;">
      Kumaramangalath, Kolakooth, Chelambra
    </div>
  </div>`;
}

function buildEvent(el) {
  el.innerHTML = `
  <div class="page-content">
    <div class="pg-label">The Celebration</div>

    <div class="pg-date-num">24</div>

    <div class="pg-name-md">JUNE 2026</div>

    <div class="pg-body" style="margin-top:10px;">
      <b>4:00 PM - 9:00 PM</b><br>
      Sreepadmam Auditorium<br>
      Kunnamangalam
    </div>

    <div class="countdown">${getCountdownText()}</div>
  </div>`;
}

function buildSaveDate(el) {
  const calLink = "https://www.google.com/calendar/render?action=TEMPLATE&text=Wedding+of+Anjana+and+Rinu&dates=20260624T103000Z/20260624T153000Z&details=You+are+invited+to+the+wedding+reception+of+Anjana+and+Rinu+at+Sreepadmam+Auditorium.&location=Sreepadmam+Auditorium,+Kunnamangalam&sf=true&output=xml";

  el.innerHTML = `
  <div class="page-content">
    <div class="pg-label">SAVE THE DATE</div>

    <div class="pg-name-md" style="margin-top:10px;">JUNE 24, 2026</div>

    <div class="pg-body" style="margin:15px 0;">
      Kindly mark your calendar for our special day.
    </div>

    <a href="${calLink}" target="_blank" class="cal-btn" onclick="event.stopPropagation();">
      ADD TO CALENDAR
    </a>
  </div>`;
}

function buildVenue(el) {
  el.innerHTML = `
  <div class="page-content">
    <div class="pg-label">Location Map</div>

    <div style="border:1px solid #D4AF37; padding:8px; margin:15px 0; box-shadow:0 0 25px rgba(212,175,55,0.08);">
      <img src="https://cdn.nxtdev.xyz/files/image/Picsart_26-05-14_00-14-09-106.png"
           style="width:160px; height:160px; display:block;">
    </div>

    <div class="pg-body">Scan to Navigate</div>

    <a href="https://go.nxtdev.xyz/NGyHDH" target="_blank" class="locate-btn" onclick="event.stopPropagation();">
      LOCATE VENUE
    </a>
  </div>`;
}

function buildPersonalized(el) {
  el.innerHTML = `
  <div class="page-content">
    <div class="pg-label">PERSONALIZED INVITE</div>

    <div class="pg-body" style="margin-bottom:10px;">
      Get Your Personalized Invitation Card on Inbox
    </div>

    <input type="text" id="userName" placeholder="Enter Your Name" class="input-field" onclick="event.stopPropagation();">

    <input type="email" id="userEmail" placeholder="Enter Email ID" class="input-field" onclick="event.stopPropagation();">

    <button id="sendBtn" class="send-btn" onclick="handleSend(event)">
      SEND NOW
    </button>

    <div id="statusMsg" style="font-size:10px; margin-top:10px; color:var(--gold-lt);"></div>
  </div>`;
}

function buildClosing(el) {
  el.innerHTML = `
  <div class="page-content" style="justify-content:space-between; padding:clamp(15px, 3vw, 25px);">

    <div></div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div class="pg-body">Your presence is our greatest gift.</div>

      <div class="pg-label" style="margin-top:6px;">With Regards</div>

      <div class="pg-name-md">Arun Mohan & Family</div>
    </div>

    <div class="pg-body" style="font-size:10px; color:var(--gold-dim); font-style:italic; cursor:pointer;" onclick="flipNext()">
      (For Personalized Invitation Click here)
    </div>
  </div>`;
}

const SPREADS = [
  [buildInside, buildCover,        'Cover'],
  [buildInside, buildHosts,        'Invitation'],
  [buildBride,  buildGroom,        'The Couple'],
  [buildEvent,  buildSaveDate,     'Save The Date'],
  [buildVenue,  buildClosing,      'With Regards'],
  [buildInside, buildPersonalized, 'Get Personalized']
];

let currentSpread = 0;

const pages = [
  document.getElementById('page1'),
  document.getElementById('page2'),
  document.getElementById('page3'),
  document.getElementById('page4'),
  document.getElementById('page5'),
  document.getElementById('page6')
];

const pFronts = [
  document.getElementById('p1front'),
  document.getElementById('p2front'),
  document.getElementById('p3front'),
  document.getElementById('p4front'),
  document.getElementById('p5front'),
  document.getElementById('p6front')
];

const pBacks = [
  document.getElementById('p1back'),
  document.getElementById('p2back'),
  document.getElementById('p3back'),
  document.getElementById('p4back'),
  document.getElementById('p5back'),
  document.getElementById('p6back')
];

const leftPage = document.getElementById('leftPage');
const indicator = document.getElementById('pageIndicator');

function renderSpread(idx) {
  leftPage.innerHTML = '';

  if (SPREADS[idx][0]) SPREADS[idx][0](leftPage);

  pages.forEach((p, i) => {
    p.classList.remove('flipped');
    p.style.zIndex = 15 - i;
    pFronts[i].innerHTML = '';
    pBacks[i].innerHTML = '';
  });

  if (SPREADS[idx][1]) SPREADS[idx][1](pFronts[0]);

  if (idx + 1 < SPREADS.length) {
    if (SPREADS[idx + 1][1]) SPREADS[idx + 1][1](pBacks[0]);
    if (SPREADS[idx + 1][0]) SPREADS[idx + 1][0](pFronts[1]);
  }

  indicator.textContent = SPREADS[idx][2];

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx >= SPREADS.length - 1;
}

let isFlipping = false;

function flipNext() {
  if (currentSpread >= SPREADS.length - 1 || isFlipping) return;

  isFlipping = true;

  pages[0].classList.add('flipped');

  requestAnimationFrame(() => {
    pages[0].style.transform = 'rotateY(-180deg)';
  });

  setTimeout(() => {
    currentSpread++;
    renderSpread(currentSpread);
    pages[0].style.transform = '';
    playFlip();
    isFlipping = false;
  }, 850);
}

function flipPrev() {
  if (currentSpread <= 0 || isFlipping) return;

  isFlipping = true;

  pages[0].classList.add('flipped');
  pages[0].style.transform = 'rotateY(-180deg)';

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      pages[0].style.transform = 'rotateY(0deg)';
    });
  });

  setTimeout(() => {
    currentSpread--;
    renderSpread(currentSpread);
    pages[0].style.transform = '';
    playFlip();
    isFlipping = false;
  }, 850);
}

function playFlip() {
  if (navigator.vibrate) navigator.vibrate(8);

  const audio = new Audio('flip.mp3');
  audio.volume = 0.15;
  audio.play().catch(() => {});
}

async function handleSend(e) {
  e.stopPropagation();

  const name = document.getElementById('userName').value.trim();
  const email = document.getElementById('userEmail').value.trim();
  const status = document.getElementById('statusMsg');
  const btn = document.getElementById('sendBtn');

  if (!name || !email) {
    status.innerText = 'Please fill all fields.';
    return;
  }

  const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!validEmail.test(email)) {
    status.innerText = 'Please enter a valid email address.';
    return;
  }

  btn.innerText = 'SENDING...';
  btn.disabled = true;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    const res = await fetch('/api/invitation', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({ name, email }),
      signal:controller.signal
    });

    clearTimeout(timeout);

    if (res.ok) {
      status.innerText = 'Sent Successfully! Check your inbox.';
      btn.innerText = 'SENT ✓';
    } else {
      throw new Error();
    }
  } catch {
    status.innerText = 'Failed to send. Please try again.';
    btn.innerText = 'SEND NOW';
    btn.disabled = false;
  }
}

if (guestName) {
  document.querySelector('.book-title').innerHTML = `✦ &nbsp; Welcome ${guestName} &nbsp; ✦`;
}

renderSpread(0);

const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');

nextBtn.onclick = flipNext;
prevBtn.onclick = flipPrev;

const bookScene = document.getElementById('bookScene');

bookScene.onclick = (e) => {
  const hint = document.getElementById('tapHint');
  if (hint) hint.style.display = 'none';

  if (
    e.target.closest('.cal-btn') ||
    e.target.closest('.send-btn') ||
    e.target.closest('.locate-btn') ||
    e.target.closest('input') ||
    e.target.closest('.music-btn')
  ) return;

  const rect = e.currentTarget.getBoundingClientRect();

  (e.clientX - rect.left > rect.width / 2)
    ? flipNext()
    : flipPrev();
};

let touchStartX = 0;

bookScene.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
});

bookScene.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].screenX;
  const diff = touchStartX - touchEndX;

  if (diff > 50) flipNext();
  if (diff < -50) flipPrev();
});

(function particles(){
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');

  let W;
  let H;
  let pts = [];

  function resize(){
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
  }

  resize();

  window.addEventListener('resize', resize);

  const PARTICLE_COUNT = window.innerWidth < 600 ? 25 : 50;

  for(let i = 0; i < PARTICLE_COUNT; i++) {
    pts.push({
      x:Math.random() * W,
      y:Math.random() * H,
      r:Math.random() * 1.8,
      vy:-(Math.random() * .5 + .1),
      vx:(Math.random() - .5) * .3,
      opacity:Math.random() * .5 + .2
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    pts.forEach(p => {
      p.y += p.vy;
      p.x += p.vx;

      if(p.y < 0) p.y = H;

      ctx.fillStyle = `rgba(212,175,55,${p.opacity})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  draw();
})();

const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');

let musicPlaying = false;

musicBtn.addEventListener('click', async () => {
  if (!musicPlaying) {
    try {
      bgMusic.volume = 0.3;
      await bgMusic.play();
      musicBtn.innerText = '♫ MUSIC ON';
      musicPlaying = true;
    } catch {}
  } else {
    bgMusic.pause();
    musicBtn.innerText = '♫ MUSIC';
    musicPlaying = false;
  }
});
</script>
